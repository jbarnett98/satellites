[project]
name = "atmospheric-perspective-pipeline"
version = "0.2.0"
description = "Turns raw catalogues and imagery in data/raw into the small static files the site loads from web/public."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "numpy>=2.0",
  "pillow>=11.0",
  "sgp4>=2.27",
]

[tool.uv]
# Plain scripts in a package folder; nothing to build or install.
package = false
